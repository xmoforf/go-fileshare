services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]

  fileshare:
    image: ghcr.io/xmoforf/go-fileshare:latest
    command: ["-origin", "https://files.example.com"]
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/file-share", "-healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 5s
    volumes:
      - type: bind
        source: ./fileshare/data
        target: /data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./fileshare/auth.json
        target: /config/auth.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./fileshare/state
        target: /state
        bind: {create_host_path: false}
    networks: [proxy, fileserver]

networks:
  proxy:
    name: proxy
  fileserver:

volumes:
  caddy_data:
  caddy_config:
