name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all release checks without publishing
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.full && '["ubuntu-26.04", "ubuntu-26.04-arm"]' || '["ubuntu-26.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.runner == 'ubuntu-26.04-arm' && 'arm64' || 'amd64' }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build native versioned image
        run: |
          set -euo pipefail
          test "$(nix develop -c go env GOARCH)" = "$ARCH"
          context="$RUNNER_TEMP/image-build"
          mkdir "$context"
          nix develop -c env CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags "-X main.version=$VERSION -X main.revision=$GITHUB_SHA" \
            -o "$context/file-share" .
          cp LICENSE THIRD_PARTY_NOTICES.md "$context/"
          cp -r licenses "$context/"
          image="go-fileshare-ci:$GITHUB_SHA-$ARCH"
          docker buildx build --builder default --load --provenance=false --platform "linux/$ARCH" \
            -f dist/Dockerfile.release -t "$image" \
            --label "org.opencontainers.image.title=go-fileshare" \
            --label "org.opencontainers.image.description=Single-owner Linux file sharing with read-only links" \
            --label "org.opencontainers.image.source=https://github.com/xmoforf/go-fileshare" \
            --label "org.opencontainers.image.url=https://github.com/xmoforf/go-fileshare" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" "$context"
          mkdir "$RUNNER_TEMP/tested-image"
          docker image inspect --format '{{.Id}}' "$image" > "$RUNNER_TEMP/tested-image/image-id.txt"
          test "$(docker run --rm --network none "$image" -version)" = "file-share $VERSION ($GITHUB_SHA)"
      - name: Native image HTTPS and persistence checks
        run: python3 tests/compose_smoke.py --image "go-fileshare-ci:$GITHUB_SHA-$ARCH"
      - name: Operator rehearsal and binary vulnerability scan
        if: inputs.full
        run: |
          python3 tests/operations_smoke.py "$RUNNER_TEMP/image-build/file-share"
          scanner=$(nix build --no-link --print-out-paths --impure --expr \
            'let f = builtins.getFlake (toString ./.); in (builtins.getAttr builtins.currentSystem f.inputs.nixpkgs.legacyPackages).govulncheck')
          "$scanner/bin/govulncheck" -mode=binary -show verbose "$RUNNER_TEMP/image-build/file-share"
      - name: Export exact tested image
        if: inputs.full
        run: |
          test "$(docker image inspect --format '{{.Id}}' "go-fileshare-ci:$GITHUB_SHA-$ARCH")" = "$(cat "$RUNNER_TEMP/tested-image/image-id.txt")"
          docker save --output "$RUNNER_TEMP/tested-image/image.tar" "go-fileshare-ci:$GITHUB_SHA-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.full
        with:
          name: image-${{ env.ARCH }}
          path: ${{ runner.temp }}/tested-image/
          if-no-files-found: error
          retention-days: 7
  contracts:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.full && '["ubuntu-26.04", "ubuntu-26.04-arm"]' || '["ubuntu-26.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix develop -c sh scripts/check-go.sh
      - run: nix build
      - if: inputs.full && matrix.runner == 'ubuntu-26.04'
        run: nix flake check
      - if: inputs.full && matrix.runner == 'ubuntu-26.04'
        run: |
          scanner=$(nix build --no-link --print-out-paths --impure --expr \
            'let f = builtins.getFlake (toString ./.); in (builtins.getAttr builtins.currentSystem f.inputs.nixpkgs.legacyPackages).govulncheck')
          nix develop -c "$scanner/bin/govulncheck" -show verbose ./...
  browsers:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/browser_options.test.cjs
      - name: Build browser fixture
        run: nix develop -c env CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/browser-fixture" .
      - name: Cross-engine checks in pinned Playwright runtime
        run: |
          mkdir "$RUNNER_TEMP/browser-evidence"
          docker run --name file-share-browser-check --network none --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/browser-fixture,dst=/fixture,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/browser-evidence,dst=/evidence" \
            -e TMPDIR=/evidence -e BROWSER_FIXTURE_BINARY=/fixture -w /work \
            mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48 \
            node tests/browser_smoke.cjs ${{ !inputs.full && '--chromium-only' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/browser-evidence/file-share-browsers-*/*.png
          if-no-files-found: warn
          retention-days: 7
