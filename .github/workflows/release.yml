name: Container release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: container-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'xmoforf/go-fileshare'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          python3 scripts/image_release.py "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: ghcr.io
            secret: GITHUB_TOKEN
          - registry: docker.io
            secret: DOCKERHUB_TOKEN
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Publish tested images and verify index
        env:
          REGISTRY: ${{ matrix.registry }}
          REGISTRY_USERNAME: ${{ matrix.registry == 'ghcr.io' && github.actor || 'xmoforf' }}
          REGISTRY_TOKEN: ${{ secrets[matrix.secret] }}
          DOCKER_CONFIG: ${{ runner.temp }}/release-docker-auth
        run: |
          mkdir -m 700 "$DOCKER_CONFIG"
          python3 scripts/image_release.py "$GITHUB_REF_NAME" --registry "$REGISTRY" --publish "$RUNNER_TEMP/images"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: publication-report-${{ matrix.registry }}
          path: ${{ runner.temp }}/images/publication.json
          if-no-files-found: warn
          retention-days: 90
