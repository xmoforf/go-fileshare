name: Container release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: container-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'xmoforf/go-fileshare'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          python3 scripts/image_release.py "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml
    with:
      full: true
  publish-ghcr:
    needs: checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Publish tested images and verify index
        env:
          REGISTRY: ghcr.io
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/release-docker-auth
        run: |
          mkdir -m 700 "$DOCKER_CONFIG"
          python3 scripts/image_release.py "$GITHUB_REF_NAME" --registry "$REGISTRY" --publish "$RUNNER_TEMP/images"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: publication-report-ghcr.io
          path: ${{ runner.temp }}/images/publication.json
          if-no-files-found: warn
          retention-days: 90
  publish-dockerhub:
    needs: checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Publish tested images and verify index
        env:
          REGISTRY: docker.io
          REGISTRY_USERNAME: xmoforf
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/release-docker-auth
        run: |
          mkdir -m 700 "$DOCKER_CONFIG"
          python3 scripts/image_release.py "$GITHUB_REF_NAME" --registry "$REGISTRY" --publish "$RUNNER_TEMP/images"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: publication-report-docker.io
          path: ${{ runner.temp }}/images/publication.json
          if-no-files-found: warn
          retention-days: 90
